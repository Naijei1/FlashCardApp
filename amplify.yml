version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 22
        - npm ci --prefer-offline
        - npm test
        - npm run typecheck
        - npm run lint
    build:
      commands:
        # Amplify does not expose console env vars to the SSR runtime; bake the
        # validated/encoded values our server needs into the build artifact.
        - npm run env:production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - ~/.npm/**/*
      - .next/cache/**/*
