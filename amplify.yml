version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 22
        - npm ci
    build:
      commands:
        # Amplify does not expose console env vars to the SSR runtime; bake the
        # ones our server code needs into .env.production at build time.
        - env | grep -e APP_PASSWORD -e SESSION_SECRET -e TABLE_NAME -e APP_REGION >> .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
